<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quadro-a-quadro</title>
<style>
  :root {
    --fundo: #15171a; --painel: #1e2126; --borda: #31353c; --texto: #e7e9ec; --fraco: #9aa1ab;
    --destaque: #4f8cff; --inicio: #ff7a59; --acende: #f5c542; --apaga: #7aa2ff; --perigo: #e5534b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  select, button { font: inherit; color: var(--texto); background: var(--painel); border: 1px solid var(--borda); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--destaque); }
  button:disabled { opacity: .45; cursor: default; }
  .fraco { color: var(--fraco); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 16px; padding: 12px 16px; height: calc(100vh - 56px); }
  #visor { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
  #hud { font-variant-numeric: tabular-nums; display: flex; gap: 16px; flex-wrap: wrap; }
  #hud b { font-size: 15px; }
  #area { flex: 1; min-height: 0; overflow: auto; background: #0c0d0f; border: 1px solid var(--borda); border-radius: 8px; display: flex; justify-content: center; }
  #moldura { position: relative; flex: none; user-select: none; }
  #moldura img { display: block; width: 100%; height: 100%; }
  #moldura.desenhando { cursor: crosshair; }
  .retangulo { position: absolute; border: 2px solid var(--acende); pointer-events: none; }
  .retangulo.novo { border-style: dashed; border-color: #fff; }
  .controles { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  /* Linha do tempo */
  #linha { position: relative; flex: none; height: 34px; background: #0c0d0f; border: 1px solid var(--borda); border-radius: 6px; cursor: pointer; overflow: hidden; touch-action: none; }
  #linha .mud { position: absolute; top: 0; height: 9px; width: 2px; margin-left: -1px; opacity: .8; }
  #linha .mud.acende { background: var(--acende); }
  #linha .mud.apaga { background: var(--apaga); }
  #linha .reg { position: absolute; top: 11px; bottom: 4px; min-width: 4px; border-radius: 2px; }
  #linha .reg.ligar { background: var(--acende); }
  #linha .reg.desligar { background: var(--apaga); }
  #linha .pend { position: absolute; top: 11px; bottom: 4px; width: 3px; margin-left: -1px; background: var(--inicio); }
  #linha .cursor { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; box-shadow: 0 0 0 1px #000; }
  .legenda { display: flex; gap: 14px; font-size: 12px; color: var(--fraco); flex-wrap: wrap; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  #painel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .cartao { background: var(--painel); border: 1px solid var(--borda); border-radius: 8px; padding: 12px; }
  .marcar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .marcar button { padding: 10px 6px; font-weight: 600; }
  #b-inicio { border-color: var(--inicio); }
  #b-acendeu { border-color: var(--acende); }
  #b-apagou { border-color: var(--apaga); }
  #aviso { min-height: 40px; margin-top: 8px; }
  #aviso.erro { color: var(--perigo); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--borda); }
  th { color: var(--fraco); font-weight: 500; }
  td:first-child, th:first-child { text-align: left; }
  #resumo td:first-child { font-weight: 600; }
  #lista { flex: 1; min-height: 120px; overflow: auto; padding: 0; }
  #lista th { position: sticky; top: 0; background: var(--painel); }
  td button { padding: 2px 7px; }
  tr.atual td { background: #26303f; }
  .tipo { font-weight: 600; }
  .tipo.ligar { color: var(--acende); }
  .tipo.desligar { color: var(--apaga); }
  .atalhos { font-size: 12px; color: var(--fraco); }
  kbd { border: 1px solid var(--borda); border-radius: 4px; padding: 0 4px; font: 12px ui-monospace, monospace; color: var(--texto); }
  progress { width: 140px; }
  #luz-estado { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; padding: 10px; }
    .marcar button { padding: 8px 4px; font-size: 13px; }
    th, td { padding: 4px 4px; font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <h1>Medição de latência</h1>
  <select id="videos"><option>carregando…</option></select>
  <span id="info" class="fraco"></span>
  <span style="flex:1"></span>
  <button id="b-exportar" title="Junta as latências de todos os vídeos em latencias_todos.csv">Exportar tudo</button>
</header>
<main>
  <section id="visor">
    <div id="hud"><b id="h-quadro">—</b><b id="h-tempo"></b><span id="h-ref" class="fraco"></span><span id="h-pend"></span></div>
    <div id="area"><div id="moldura"><img id="quadro" alt=""><div id="roi" class="retangulo" hidden></div><div id="novo" class="retangulo novo" hidden></div></div></div>
    <div id="linha" title="Clique ou arraste para ir a um ponto do vídeo"></div>
    <div class="legenda">
      <span><i style="background:var(--acende)"></i>acendimento marcado</span>
      <span><i style="background:var(--apaga)"></i>desligamento marcado</span>
      <span><i style="background:var(--inicio)"></i>início pendente</span>
      <span>tracinhos no alto: mudanças detectadas da lâmpada</span>
    </div>
    <div class="controles">
      <button data-passo="-240">−240</button><button data-passo="-24">−24</button><button data-passo="-1">−1</button>
      <button data-passo="1">+1</button><button data-passo="24">+24</button><button data-passo="240">+240</button>
      <select id="zoom" title="Tamanho da imagem">
        <option value="0">Ajustar</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option>
      </select>
    </div>
    <div class="controles">
      <button id="b-luz" title="Arraste um retângulo em volta da lâmpada; a página acha cada vez que ela muda">Marcar lâmpada</button>
      <progress id="prog" max="1" value="0" hidden></progress>
      <button id="b-limpar-luz" title="Apaga a região da lâmpada e as mudanças detectadas deste vídeo" hidden>Limpar</button>
      <span id="luz-estado" class="fraco"></span>
      <button id="b-ant" disabled>◀ Mudança <kbd>P</kbd></button>
      <button id="b-prox" disabled>Mudança <kbd>N</kbd> ▶</button>
    </div>
  </section>
  <aside id="painel">
    <div class="cartao">
      <div class="marcar">
        <button id="b-inicio"><kbd>1</kbd> Início</button>
        <button id="b-acendeu"><kbd>2</kbd> Acendeu</button>
        <button id="b-apagou"><kbd>3</kbd> Apagou</button>
      </div>
      <div id="aviso" class="fraco">Escolha um vídeo.</div>
    </div>
    <div class="cartao">
      <table id="resumo">
        <thead><tr><th></th><th>n</th><th>média</th><th>desvio</th><th>mín.</th><th>máx.</th></tr></thead>
        <tbody></tbody>
      </table>
      <div style="text-align:right;margin-top:8px">
        <button id="b-limpar-marcacoes" title="Apaga todos os acionamentos marcados neste vídeo">Apagar marcações</button>
      </div>
    </div>
    <div class="cartao" id="lista">
      <table>
        <thead><tr><th>#</th><th>Tipo</th><th>Início (ms)</th><th>Lâmpada (ms)</th><th>Latência</th><th></th></tr></thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
    <div class="atalhos">
      <kbd>←</kbd><kbd>→</kbd> ou <kbd>A</kbd><kbd>D</kbd> 1 quadro ·
      <kbd>↑</kbd><kbd>↓</kbd> ou <kbd>W</kbd><kbd>S</kbd> 24 ·
      <kbd>F</kbd><kbd>R</kbd> 240 ·
      <kbd>Z</kbd> referência ·
      <kbd>U</kbd> desfazer ·
      <span id="arquivo"></span>
    </div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const ms = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const sinal = v => (v >= 0 ? "+" : "−") + ms(Math.abs(v));
const NOME = { ligar: "acende", desligar: "apaga" };

const est = { video: null, n: 0, tempos: [], larg: 720, alt: 1280, atual: 0, mostrado: -1, carregando: false,
              registros: [], pendente: null, ref: null, luz: null, desenho: null };

function guardar(chave, valor) { try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) {} }
function ler(chave) { try { return JSON.parse(localStorage.getItem(chave)); } catch (e) { return null; } }

function aviso(texto, erro = false) { $("aviso").textContent = texto; $("aviso").className = erro ? "erro" : "fraco"; }

async function api(caminho, corpo) {
  const r = await fetch(caminho, corpo === undefined ? {} : { method: "POST", body: JSON.stringify(corpo) });
  return r.json();
}

async function listarVideos() {
  const d = await api("/api/videos");
  const sel = $("videos");
  sel.innerHTML = '<option value="">Escolha um vídeo…</option>' + d.videos.map(v =>
    `<option value="${v.nome}">${v.nome} (${v.mb} MB${v.marcados ? `, ${v.marcados} marcados` : ""})</option>`).join("");
  const ultimo = ler("ultimo-video");
  if (ultimo && d.videos.some(v => v.nome === ultimo)) { sel.value = ultimo; abrir(ultimo); }
}

async function abrir(nome) {
  if (!nome) return;
  aviso("Abrindo o vídeo…");
  const d = await api(`/api/abrir?v=${encodeURIComponent(nome)}`);
  Object.assign(est, { video: nome, n: d.n, tempos: d.tempos, larg: d.largura, alt: d.altura, mostrado: -1,
                       registros: d.registros, pendente: null, ref: null, luz: d.luz });
  guardar("ultimo-video", nome);
  $("videos").value = nome;
  $("info").textContent = `${d.n} quadros · ${d.fps.toLocaleString("pt-BR")} fps`;
  $("arquivo").textContent = "Salvo em " + d.arquivo;
  ajustarTamanho();
  atualizarLuz();
  aviso("Ache o início do acionamento e tecle 1.");
  irPara(ler("pos:" + nome) || 0);
  atualizarTudo();
}

function irPara(q) {
  if (!est.video) return;
  est.atual = Math.max(0, Math.min(est.n - 1, Math.round(q)));
  guardar("pos:" + est.video, est.atual);
  posicionarCursor();
  pedirQuadro();
}

function pedirQuadro() {
  if (est.carregando || est.mostrado === est.atual) return;
  est.carregando = true;
  const alvo = est.atual, img = $("quadro");
  img.onload = () => { est.carregando = false; est.mostrado = alvo; atualizarHud(); pedirQuadro(); };
  img.onerror = () => { est.carregando = false; };
  img.src = `/api/quadro?v=${encodeURIComponent(est.video)}&i=${alvo}`;
}

function atualizarHud() {
  const q = est.mostrado, t = est.tempos[q];
  if (q < 0) return;
  $("h-quadro").textContent = `quadro ${q} / ${est.n - 1}`;
  $("h-tempo").textContent = `t = ${ms(t)} ms`;
  $("h-ref").textContent = est.ref === null ? "" :
    `desde a referência: ${q - est.ref >= 0 ? "+" : ""}${q - est.ref} quadros = ${sinal(t - est.tempos[est.ref])} ms`;
  $("h-pend").innerHTML = est.pendente === null ? "" :
    `<span style="color:var(--inicio)">desde o início: ${sinal(t - est.tempos[est.pendente])} ms</span>`;
  const atual = est.registros.find(r => r.q0 <= q && q <= r.q1);
  document.querySelectorAll("#tabela tr").forEach(tr => tr.classList.toggle("atual", !!atual && +tr.dataset.q0 === atual.q0));
}

// Linha do tempo: mudanças detectadas, acionamentos marcados, início pendente e posição atual
const pct = q => (est.n > 1 ? q / (est.n - 1) * 100 : 0);

function desenharLinha() {
  const partes = (est.luz?.estado === "pronto" ? est.luz.mudancas : []).map(([q, d]) =>
    `<div class="mud ${d > 0 ? "acende" : "apaga"}" style="left:${pct(q)}%" data-q="${q}"
          title="Lâmpada ${d > 0 ? "acende" : "apaga"} em ${ms(est.tempos[q])} ms"></div>`);
  ordenados().forEach((r, i) => partes.push(
    `<div class="reg ${r.tipo}" style="left:${pct(r.q0)}%;width:${pct(r.q1) - pct(r.q0)}%" data-q="${r.q0}"
          title="#${i + 1} ${NOME[r.tipo]}: ${ms(est.tempos[r.q1] - est.tempos[r.q0])} ms"></div>`));
  if (est.pendente !== null) partes.push(`<div class="pend" style="left:${pct(est.pendente)}%" data-q="${est.pendente}" title="Início pendente"></div>`);
  partes.push('<div class="cursor" id="cursor"></div>');
  $("linha").innerHTML = partes.join("");
  posicionarCursor();
}

function posicionarCursor() { const c = $("cursor"); if (c) c.style.left = pct(est.atual) + "%"; }

function quadroDaLinha(ev) {
  const r = $("linha").getBoundingClientRect();
  return Math.round(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * (est.n - 1));
}
let arrastando = false;
$("linha").addEventListener("pointerdown", ev => {
  if (!est.video) return;
  const q = ev.target.dataset.q;
  if (q !== undefined) return irPara(+q);
  arrastando = true; $("linha").setPointerCapture(ev.pointerId); irPara(quadroDaLinha(ev));
});
$("linha").addEventListener("pointermove", ev => { if (arrastando) irPara(quadroDaLinha(ev)); });
$("linha").addEventListener("pointerup", () => { arrastando = false; });

// Acionamentos marcados
function ordenados() { return [...est.registros].sort((a, b) => a.q0 - b.q0); }
const latencia = r => est.tempos[r.q1] - est.tempos[r.q0];

function estatisticas(lat) {
  const n = lat.length, media = n ? lat.reduce((a, b) => a + b, 0) / n : null;
  const desvio = n > 1 ? Math.sqrt(lat.reduce((a, b) => a + (b - media) ** 2, 0) / (n - 1)) : null;
  const f = v => (v === null || v === undefined ? "—" : ms(v));
  return [n, f(media), f(desvio), f(n ? Math.min(...lat) : null), f(n ? Math.max(...lat) : null)];
}

function desenharTabela() {
  const regs = ordenados();
  $("tabela").innerHTML = regs.map((r, i) => `<tr data-q0="${r.q0}">
      <td>${i + 1}</td><td class="tipo ${r.tipo}">${NOME[r.tipo]}</td>
      <td>${ms(est.tempos[r.q0])}</td><td>${ms(est.tempos[r.q1])}</td><td><b>${ms(latencia(r))}</b></td>
      <td><button data-ir="${r.q0}" title="Ir ao início">ir</button> <button data-apagar="${r.q0}" title="Apagar">×</button></td></tr>`).join("");
  $("resumo").tBodies[0].innerHTML = [["ligar", "Acender"], ["desligar", "Apagar"]].map(([tipo, rotulo]) =>
    `<tr><td class="tipo ${tipo}">${rotulo}</td>${estatisticas(regs.filter(r => r.tipo === tipo).map(latencia))
      .map(v => `<td>${v}</td>`).join("")}</tr>`).join("");
}

function atualizarTudo() { desenharTabela(); desenharLinha(); atualizarHud(); }

async function salvar() {
  const d = await api(`/api/salvar?v=${encodeURIComponent(est.video)}`, { registros: est.registros });
  if (d.erro) aviso("Erro ao salvar: " + d.erro, true);
}

function marcarInicio() {
  if (est.mostrado < 0) return;
  est.pendente = est.mostrado;
  aviso(`Início no quadro ${est.pendente} (${ms(est.tempos[est.pendente])} ms). Avance até a lâmpada mudar e tecle 2 (acendeu) ou 3 (apagou).`);
  atualizarTudo();
}

// Mudança detectada mais perto do quadro, para conferir o tipo escolhido
function mudancaPerto(q) {
  if (est.luz?.estado !== "pronto") return null;
  const limite = 0.25 * (est.n - 1) / ((est.tempos[est.n - 1] - est.tempos[0]) / 1000);
  let melhor = null;
  for (const [m, d] of est.luz.mudancas) if (Math.abs(m - q) <= limite && (!melhor || Math.abs(m - q) < Math.abs(melhor[0] - q))) melhor = [m, d];
  return melhor;
}

function marcarLampada(tipo) {
  if (est.pendente === null) return aviso("Marque primeiro o início do acionamento (tecla 1).", true);
  if (est.mostrado <= est.pendente) return aviso("A lâmpada precisa mudar depois do início. Avance o vídeo.", true);
  const r = { q0: est.pendente, q1: est.mostrado, tipo };
  est.registros = est.registros.filter(x => x.q0 !== r.q0);
  est.registros.push(r);
  est.pendente = null;
  const perto = mudancaPerto(r.q1);
  if (perto && (perto[1] > 0) !== (tipo === "ligar"))
    aviso(`Salvo como "${NOME[tipo]}", mas a lâmpada parece ${perto[1] > 0 ? "acender" : "apagar"} aqui. Confira: U desfaz.`, true);
  else aviso(`Salvo (${NOME[tipo]}): ${ms(latencia(r))} ms. Vá ao próximo acionamento e tecle 1.`);
  atualizarTudo(); salvar();
}

function desfazer() {
  if (est.pendente !== null) { est.pendente = null; aviso("Início desmarcado."); }
  else if (est.registros.length) { est.registros.pop(); aviso("Último acionamento apagado."); salvar(); }
  atualizarTudo();
}

// Imagem e região da lâmpada
function ajustarTamanho() {
  const z = +$("zoom").value, area = $("area"), m = $("moldura");
  const alt = z ? est.alt * z : area.clientHeight - 2;
  m.style.height = alt + "px";
  m.style.width = (alt * est.larg / est.alt) + "px";
}

function posicionar(el, r) {
  el.style.left = (r[0] / est.larg * 100) + "%"; el.style.top = (r[1] / est.alt * 100) + "%";
  el.style.width = (r[2] / est.larg * 100) + "%"; el.style.height = (r[3] / est.alt * 100) + "%";
}

function atualizarLuz() {
  const luz = est.luz || {};
  $("roi").hidden = !luz.roi;
  if (luz.roi) posicionar($("roi"), luz.roi);
  $("prog").hidden = luz.estado !== "medindo";
  $("prog").value = luz.progresso || 0;
  const pronto = luz.estado === "pronto";
  $("b-ant").disabled = $("b-prox").disabled = !pronto;
  $("b-luz").disabled = luz.estado === "medindo";
  $("b-limpar-luz").hidden = !luz.roi || luz.estado === "medindo";
  const muds = luz.mudancas || [];
  $("luz-estado").textContent = {
    nenhuma: "Opcional: marque a lâmpada para pular entre os acionamentos.",
    medindo: "Medindo a lâmpada em todos os quadros…",
    pronto: `${muds.filter(m => m[1] > 0).length} acendimentos e ${muds.filter(m => m[1] < 0).length} desligamentos detectados.`,
    erro: "Erro: " + (luz.erro || "")
  }[luz.estado] || "";
  $("luz-estado").title = $("luz-estado").textContent;
  desenharLinha();
  requestAnimationFrame(ajustarTamanho);
}

async function acompanharLuz() {
  est.luz = await api(`/api/lampada?v=${encodeURIComponent(est.video)}`);
  atualizarLuz();
  if (est.luz.estado === "medindo") setTimeout(acompanharLuz, 700);
}

function pularMudanca(dir) {
  const muds = (est.luz?.mudancas || []).map(m => m[0]);
  const q = dir > 0 ? muds.find(m => m > est.atual) : [...muds].reverse().find(m => m < est.atual);
  if (q === undefined) return;
  const k = muds.indexOf(q), acende = est.luz.mudancas[k][1] > 0;
  aviso(`Mudança ${k + 1}/${muds.length}: a lâmpada ${acende ? "acende" : "apaga"} aqui. Volte até o início do acionamento e tecle 1.`);
  irPara(q);
}

function ponto(ev) {
  const r = $("moldura").getBoundingClientRect();
  return [Math.max(0, Math.min(est.larg, (ev.clientX - r.left) / r.width * est.larg)),
          Math.max(0, Math.min(est.alt, (ev.clientY - r.top) / r.height * est.alt))];
}
$("b-luz").onclick = () => {
  if (!est.video) return;
  $("moldura").classList.add("desenhando");
  aviso("Arraste um retângulo em volta da lâmpada que acende neste vídeo.");
};
$("moldura").onmousedown = ev => {
  if (!$("moldura").classList.contains("desenhando")) return;
  est.desenho = { a: ponto(ev) }; ev.preventDefault();
};
window.addEventListener("mousemove", ev => {
  if (!est.desenho) return;
  const [x0, y0] = est.desenho.a, [x1, y1] = ponto(ev);
  est.desenho.r = [Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0)].map(Math.round);
  $("novo").hidden = false; posicionar($("novo"), est.desenho.r);
});
window.addEventListener("mouseup", async () => {
  if (!est.desenho) return;
  const r = est.desenho.r; est.desenho = null;
  $("moldura").classList.remove("desenhando"); $("novo").hidden = true;
  if (!r || r[2] < 4 || r[3] < 4) return aviso("Retângulo muito pequeno. Clique em Marcar lâmpada de novo.", true);
  await api(`/api/lampada?v=${encodeURIComponent(est.video)}`, { roi: r });
  aviso("Medindo a lâmpada. Enquanto isso, você já pode marcar à mão.");
  acompanharLuz();
});

// Controles
$("videos").onchange = e => abrir(e.target.value);
$("zoom").onchange = ajustarTamanho;
new ResizeObserver(ajustarTamanho).observe($("area"));
document.querySelectorAll("[data-passo]").forEach(b => b.onclick = () => irPara(est.atual + +b.dataset.passo));
$("b-inicio").onclick = marcarInicio;
$("b-acendeu").onclick = () => marcarLampada("ligar");
$("b-apagou").onclick = () => marcarLampada("desligar");
$("b-ant").onclick = () => pularMudanca(-1);
$("b-prox").onclick = () => pularMudanca(1);
$("tabela").onclick = e => {
  const ir = e.target.dataset.ir, apagar = e.target.dataset.apagar;
  if (ir) irPara(+ir);
  if (apagar && confirm("Apagar este acionamento?")) {
    est.registros = est.registros.filter(r => r.q0 !== +apagar); atualizarTudo(); salvar();
  }
};
async function limpar(o_que, pergunta, feito) {
  if (!est.video || !confirm(pergunta)) return;
  const d = await api(`/api/limpar?v=${encodeURIComponent(est.video)}`, { o_que });
  if (d.erro) return aviso("Não deu para limpar: " + d.erro, true);
  est.luz = d.luz; est.registros = d.registros; est.pendente = null;
  atualizarLuz(); atualizarTudo(); aviso(feito);
}
$("b-limpar-luz").onclick = () => limpar("lampada",
  "Apagar a região da lâmpada e as mudanças detectadas deste vídeo? As marcações de acionamento continuam.",
  "Marcação da lâmpada apagada.");
$("b-limpar-marcacoes").onclick = () => limpar("marcacoes",
  `Apagar TODOS os ${est.registros.length} acionamentos marcados em ${est.video}? Não dá para desfazer.`,
  "Marcações deste vídeo apagadas.");
$("b-exportar").onclick = async () => {
  const d = await api("/api/exportar", {});
  aviso(`${d.linhas} acionamentos exportados para ${d.arquivo}`);
};
const TECLAS = { ArrowRight: 1, d: 1, ArrowLeft: -1, a: -1, ArrowUp: 24, w: 24, ArrowDown: -24, s: -24, f: 240, r: -240 };
window.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k in TECLAS) { e.preventDefault(); irPara(est.atual + TECLAS[k]); }
  else if (k === "1") marcarInicio();
  else if (k === "2") marcarLampada("ligar");
  else if (k === "3") marcarLampada("desligar");
  else if (k === "n") pularMudanca(1);
  else if (k === "p") pularMudanca(-1);
  else if (k === "u") desfazer();
  else if (k === "z" && est.mostrado >= 0) { est.ref = est.mostrado; atualizarHud(); }
});
listarVideos();
</script>
